server {
    listen 80;
    root /usr/share/nginx/html;

    # File khôi phục sao lưu có thể chứa nhiều ảnh
    client_max_body_size 500m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS nội bộ của Docker: phân giải lại "api" khi container api được tạo lại (đổi IP)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # File build có mã băm trong tên → lưu lâu trên trình duyệt
    location /assets/ {
        # nginx chưa biết đuôi .mjs (worker của pdf.js): thiếu dòng này trình duyệt từ chối chạy → không xem in được
        include /etc/nginx/mime.types;
        types { application/javascript mjs; }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
