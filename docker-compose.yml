# Mọi cổng / mật khẩu lấy từ file .env (xem .env.example)
#   Chạy toàn bộ (db + api + web):  docker compose up -d --build
#   Chỉ chạy DB (khi dev):           docker compose up -d db
name: hiep-dung-cms

services:
  # Cơ sở dữ liệu — dùng image PostgreSQL chính thức, không cần build
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Máy chủ API (Express + Prisma) — tự chạy migration khi khởi động
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      APP_SECRET: ${APP_SECRET}
      # Tài khoản quản trị đầu tiên (seed tạo khi DB chưa có tài khoản nào). APP_PASSWORD: tên cũ, vẫn nhận
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-${APP_PASSWORD:-}}
      LANDING_ORIGIN: ${LANDING_ORIGIN:-}
      SEED_DU_LIEU_MAU: ${SEED_DU_LIEU_MAU:-true}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # File PDF / Word / Excel ghi vào /app/file trong container = thư mục THU_MUC_LUU_FILE trên máy thật
      THU_MUC_LUU_FILE: /app/file
      THU_MUC_LUU_FILE_TREN_MAY: ${THU_MUC_LUU_FILE:-./file}
    volumes:
      - ${THU_MUC_LUU_FILE:-./file}:/app/file
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/suc-khoe || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Giao diện: nginx phục vụ bản build, chuyển /api sang container api
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Chỉ đổi cổng bằng WEB_PORT trong .env; vế phải (80) là cổng nginx bên trong container, giữ nguyên
      - "${WEB_PORT:-5175}:80"

volumes:
  du_lieu_postgres:
