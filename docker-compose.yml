# PostgreSQL cho lúc phát triển (npm run dev:api). Bản dùng thật là app desktop, không cần Docker.
#   Chạy: npm run db:up   (= docker compose up -d db); cổng / mật khẩu lấy từ .env
name: hiep-dung-cms

services:
  # Cơ sở dữ liệu — dùng image PostgreSQL chính thức, không cần build
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  du_lieu_postgres:
